openapi: 3.1.0
info:
  title: Loja da Quinta API
  version: 0.1.0
  description: |
    Contrato único entre o backend (api/) e o frontend (web/).
    O código dos dois lados é gerado a partir deste ficheiro (ADR-0003).
servers:
  - url: /api/v1
tags:
  - name: health
  - name: auth
    description: Sessão dos utilizadores internos (ADR-0005)
  - name: users
    description: Gestão dos utilizadores internos pelo gestor (UC-02)
  - name: catalog
    description: Categorias, produtos e imagens (UC-03, ADR-0014)
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: O processo está vivo
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [health]
      operationId: getReadiness
      summary: O processo está pronto (BD acessível)
      security: []
      responses:
        "200":
          description: Pronto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Inicia sessão com e-mail e palavra-passe
      description: |
        Devolve o access token (15 min) no corpo e o refresh token (7 dias) num
        cookie HttpOnly. O erro é sempre o mesmo para e-mail desconhecido,
        palavra-passe errada ou conta desativada.
      security: []
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/SessionStarted"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Renova a sessão com o refresh token do cookie
      description: |
        Roda o refresh token: o antigo deixa de valer e chega um novo no
        cookie. Se aparecer um refresh já usado, a família inteira é revogada
        (deteção de reutilização) e a sessão termina.
      security: []
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "200":
          $ref: "#/components/responses/SessionStarted"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/SessionEnded"
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Termina a sessão
      description: Revoga a família do refresh token e apaga o cookie. Responde 204 mesmo sem sessão.
      security: []
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "204":
          description: Sessão terminada
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearRefreshCookie"
        "400":
          $ref: "#/components/responses/Problem"
  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Utilizador da sessão atual
      security:
        - bearerAuth: [funcionario, gestor]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: Lista os utilizadores, ativos e desativados
      security:
        - bearerAuth: [gestor]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagedUser"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      tags: [users]
      operationId: createUser
      summary: Cria um utilizador
      security:
        - bearerAuth: [gestor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUser"
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /users/{id}:
    patch:
      tags: [users]
      operationId: updateUser
      summary: Edita um utilizador (nome, papel, estado ou palavra-passe)
      description: |
        Desativar, mudar o papel ou definir uma palavra-passe nova termina
        todas as sessões do utilizador. Não há DELETE: um utilizador fica
        sempre no histórico (vendas, auditoria) e só se desativa. O gestor
        não pode desativar nem tirar o papel de gestor à própria conta.
      security:
        - bearerAuth: [gestor]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /categories:
    get:
      tags: [catalog]
      operationId: listCategories
      summary: Lista as categorias, com o número de produtos de cada uma
      security:
        - bearerAuth: [funcionario, gestor]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      tags: [catalog]
      operationId: createCategory
      summary: Cria uma categoria
      security:
        - bearerAuth: [gestor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /categories/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [catalog]
      operationId: renameCategory
      summary: Muda o nome de uma categoria
      security:
        - bearerAuth: [gestor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [catalog]
      operationId: deleteCategory
      summary: Apaga uma categoria sem produtos
      security:
        - bearerAuth: [gestor]
      responses:
        "204":
          description: Apagada
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /products:
    get:
      tags: [catalog]
      operationId: listProducts
      summary: Lista todos os produtos, ativos e inativos
      security:
        - bearerAuth: [funcionario, gestor]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      tags: [catalog]
      operationId: createProduct
      summary: Cria um produto
      security:
        - bearerAuth: [gestor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          $ref: "#/components/responses/ProductWithETag"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /products/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [catalog]
      operationId: getProduct
      summary: Um produto, com o ETag para o editar
      security:
        - bearerAuth: [funcionario, gestor]
      responses:
        "200":
          $ref: "#/components/responses/ProductWithETag"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      tags: [catalog]
      operationId: updateProduct
      summary: Substitui os dados de um produto
      description: |
        Exige If-Match com a versão lida (o ETag, ou o campo version). Se
        outra pessoa mudou o produto entretanto, responde 412 e não grava:
        nenhuma alteração se perde sem aviso.
      security:
        - bearerAuth: [gestor]
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          $ref: "#/components/responses/ProductWithETag"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [catalog]
      operationId: deleteProduct
      summary: Apaga um produto sem histórico
      description: Um produto com stock ou vendas não se apaga (409); desativa-se.
      security:
        - bearerAuth: [gestor]
      responses:
        "204":
          description: Apagado
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /products/{id}/image:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [catalog]
      operationId: putProductImage
      summary: Troca a imagem do produto
      description: |
        JPEG, PNG ou WebP até 5 MB e 40 megapíxeis. O formato é verificado
        pelo conteúdo, nunca pelo Content-Type. A imagem é sempre
        reprocessada em JPEG (800 px e 160 px) e o original é descartado,
        com os metadados (EXIF, GPS) incluídos (ADR-0014).
      security:
        - bearerAuth: [gestor]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Imagem trocada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [catalog]
      operationId: deleteProductImage
      summary: Remove a imagem do produto
      security:
        - bearerAuth: [gestor]
      responses:
        "204":
          description: Removida
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /public/products/{id}/image:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [catalog]
      operationId: getProductImage
      summary: Imagem de um produto (pública, imutável)
      description: |
        O URL só funciona com a versão atual (v), que muda sempre que a
        imagem muda: pode ficar em cache para sempre, e as imagens não se
        adivinham pelo ID do produto.
      security: []
      parameters:
        - name: size
          in: query
          required: true
          schema:
            type: string
            enum: [thumb, large]
        - name: v
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      responses:
        "200":
          description: JPEG
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
            ETag:
              required: true
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /public/catalog:
    get:
      tags: [catalog]
      operationId: getPublicCatalog
      summary: Catálogo público (sem sessão)
      description: |
        Os produtos ativos e visíveis no catálogo, por categoria e nome.
        Devolve só o que uma pessoa precisa para escolher: nunca quantidades
        exatas, IVA, limiar de stock nem datas internas. A resposta pode
        ficar 60 s em cache (Cache-Control).
      security: []
      responses:
        "200":
          description: Lista de produtos (pode estar vazia)
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogItem"
# Tudo é negado por omissão (docs/security/authz-matrix.md). Os papéis com
# acesso a cada operação vão na lista do bearerAuth (OpenAPI 3.1 permite
# papéis em esquemas que não são OAuth). Uma lista vazia não deixa ninguém
# entrar; uma operação pública declara `security: []`.
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Csrf:
      name: X-CSRF
      in: header
      required: true
      description: Proteção contra CSRF. Um site de outra origem não consegue enviar este cabeçalho sem um preflight CORS, que a API nunca aceita.
      schema:
        type: string
        enum: ["1"]
    RefreshCookie:
      name: refresh_token
      in: cookie
      required: false
      schema:
        type: string
        maxLength: 128
  headers:
    SetRefreshCookie:
      description: "refresh_token=…; Path=/api/v1/auth; Max-Age=604800; HttpOnly; Secure; SameSite=Strict"
      required: true
      schema:
        type: string
    ClearRefreshCookie:
      description: "refresh_token=; Path=/api/v1/auth; Max-Age=0; HttpOnly; Secure; SameSite=Strict"
      required: true
      schema:
        type: string
  responses:
    ProductWithETag:
      description: Produto, com a versão no ETag
      headers:
        ETag:
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Product"
    Problem:
      description: Erro no formato RFC 9457 (problem+json)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    SessionStarted:
      description: Sessão iniciada ou renovada
      headers:
        Set-Cookie:
          $ref: "#/components/headers/SetRefreshCookie"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Session"
    SessionEnded:
      description: Sem sessão válida. O cookie é apagado.
      headers:
        Set-Cookie:
          $ref: "#/components/headers/ClearRefreshCookie"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Commit da versão em execução ("dev" em desenvolvimento). O deploy usa-o para saber quando a versão nova já está no ar.
          example: 3c81f75
    Role:
      type: string
      enum: [funcionario, gestor]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
    User:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    ManagedUser:
      type: object
      required: [id, email, name, role, active, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NewUser:
      type: object
      additionalProperties: false
      required: [email, name, role, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          $ref: "#/components/schemas/Role"
        password:
          type: string
          minLength: 12
          maxLength: 128
    UserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          $ref: "#/components/schemas/Role"
        active:
          type: boolean
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Palavra-passe nova, definida pelo gestor (por exemplo, se o utilizador a esqueceu).
    Unit:
      type: string
      enum: [kg, l, un, molho, duzia]
      description: kg e l aceitam casas decimais; un, molho e duzia só inteiros.
    VatRate:
      type: integer
      enum: [6, 13, 23]
    Category:
      type: object
      required: [id, name, productCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        productCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CategoryInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
    ProductInput:
      type: object
      additionalProperties: false
      required: [categoryId, name, unit, priceCents, vatRate, seasonMonths, lowStockMilli, isPublic, active]
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        unit:
          $ref: "#/components/schemas/Unit"
        priceCents:
          type: integer
          minimum: 0
          maximum: 10000000
          description: Preço por unidade, com IVA, em cêntimos (ADR-0009).
        vatRate:
          $ref: "#/components/schemas/VatRate"
        seasonMonths:
          type: array
          uniqueItems: true
          maxItems: 12
          items:
            type: integer
            minimum: 1
            maximum: 12
          description: Meses da época (1 = janeiro). Vazio quer dizer todo o ano.
        lowStockMilli:
          type: integer
          format: int64
          minimum: 0
          maximum: 999999999999
          description: Limiar de stock baixo em milésimos da unidade (2500 = 2,5 kg). Para un, molho e duzia, múltiplo de 1000.
        isPublic:
          type: boolean
        active:
          type: boolean
    Product:
      allOf:
        - $ref: "#/components/schemas/ProductInput"
        - type: object
          required: [id, categoryName, version, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            categoryName:
              type: string
            image:
              $ref: "#/components/schemas/ProductImage"
            version:
              type: string
              description: Versão para o If-Match (igual ao ETag, sem aspas).
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    ProductImage:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: Hash da imagem; vai no parâmetro v do URL público.
    Availability:
      type: string
      enum: [disponivel, pouco, esgotado]
      description: Estado do stock sem expor a quantidade. esgotado com stock 0; pouco abaixo do limiar de stock baixo do produto.
    CatalogItem:
      type: object
      description: Produto como o público o vê. Nunca tem quantidades exatas nem campos internos.
      required: [id, name, categoryName, unit, priceCents, seasonMonths, availability]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        categoryName:
          type: string
        unit:
          $ref: "#/components/schemas/Unit"
        priceCents:
          type: integer
          description: Preço por unidade, com IVA, em cêntimos (ADR-0009).
        seasonMonths:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 12
          description: Meses da época (1 = janeiro). Vazio quer dizer todo o ano.
        image:
          $ref: "#/components/schemas/ProductImage"
        availability:
          $ref: "#/components/schemas/Availability"
    Session:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: JWT Ed25519. Fica só em memória no browser.
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Segundos até o access token expirar.
          example: 900
        user:
