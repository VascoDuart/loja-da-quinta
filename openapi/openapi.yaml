openapi: 3.1.0
info:
  title: Loja da Quinta API
  version: 0.1.0
  description: |
    Contrato único entre o backend (api/) e o frontend (web/).
    O código dos dois lados é gerado a partir deste ficheiro (ADR-0003).
servers:
  - url: /api/v1
tags:
  - name: health
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: O processo está vivo
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [health]
      operationId: getReadiness
      summary: O processo está pronto (BD acessível)
      security: []
      responses:
        "200":
          description: Pronto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Problem"
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: Erro no formato RFC 9457 (problem+json)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
