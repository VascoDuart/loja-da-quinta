# Ambiente local: PostgreSQL, migrações e API. O frontend entra com a #6.
#
#   cp .env.example .env
#   docker compose up -d --build
#
# A API fica em http://localhost:8080/api/v1/healthz

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-loja}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?define DB_MIGRATOR_PASSWORD no .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?define DB_APP_PASSWORD no .env}
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD:?define DB_READONLY_PASSWORD no .env}
    ports:
      # Só acessível a partir desta máquina (DBeaver incluído)
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/01-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Corre uma vez, com o papel migrator, e termina.
  migrate:
    build: ./api
    entrypoint: ["/migrate"]
    environment:
      MIGRATIONS_DATABASE_URL: postgres://migrator:${DB_MIGRATOR_PASSWORD}@db:5432/${POSTGRES_DB:-loja}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  # A API liga-se com o papel app, que não tem permissões de DDL.
  api:
    build: ./api
    restart: unless-stopped
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: postgres://app:${DB_APP_PASSWORD}@db:5432/${POSTGRES_DB:-loja}?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
