<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spike #3 · rewrite e arranque a frio</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; line-height: 1.5; }
  button { font: inherit; padding: 8px 14px; margin: 4px 4px 4px 0; cursor: pointer; }
  pre { background: #f2f2f2; padding: 12px; overflow-x: auto; }
</style>
</head>
<body>
<h1>Spike #3</h1>
<p>Cada botão faz um pedido a <code>/api/v1/…</code> nesta mesma origem. A Vercel reencaminha-o para a API na Render.</p>
<p>
  <button data-path="/api/v1/healthz">Health check (medir arranque a frio)</button>
  <button data-path="/api/v1/slow?ms=30000">Pedido de 30 s</button>
  <button data-path="/api/v1/slow?ms=60000">Pedido de 60 s</button>
  <button data-path="/api/v1/slow?ms=90000">Pedido de 90 s</button>
</p>
<p>
  <button data-path="/api/v1/cookie" data-method="POST">Definir cookie SameSite=Strict</button>
  <button data-path="/api/v1/cookie">Verificar se o cookie chega à API</button>
</p>
<pre id="log">Resultados aparecem aqui.</pre>
<script>
  const log = document.getElementById('log');
  document.querySelectorAll('button').forEach((b) => b.addEventListener('click', async () => {
    const started = performance.now();
    let line;
    try {
      const res = await fetch(b.dataset.path, { method: b.dataset.method || 'GET', credentials: 'same-origin' });
      const body = await res.text();
      line = `${b.dataset.method || 'GET'} ${b.dataset.path} → ${res.status} em ${Math.round(performance.now() - started)} ms\n${body}`;
    } catch (e) {
      line = `${b.dataset.path} → erro em ${Math.round(performance.now() - started)} ms: ${e}`;
    }
    log.textContent = `[${new Date().toLocaleTimeString('pt-PT')}] ${line}\n\n` + (log.textContent === 'Resultados aparecem aqui.' ? '' : log.textContent);
  }));
</script>
</body>
</html>
