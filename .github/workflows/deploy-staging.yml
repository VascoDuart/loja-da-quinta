name: deploy-staging

# Publica cada merge na dev em staging e corre os testes E2E contra ele.
#
#   1. migrações na Neon (branch staging), com o papel migrator;
#   2. contas dos testes E2E (só são criadas se ainda não existirem);
#   3. deploy da API na Render (Auto-Deploy desligado: só depois das migrações);
#   4. espera que a API e o frontend (a Vercel publica sozinha a dev) estejam
#      na versão deste commit;
#   5. testes E2E com Playwright contra https://loja-da-quinta-staging.vercel.app.
#
# Segredos: STAGING_MIGRATIONS_DATABASE_URL, RENDER_STAGING_DEPLOY_HOOK,
# E2E_GESTOR_PASSWORD e E2E_FUNCIONARIO_PASSWORD.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# Nunca dois deploys de staging ao mesmo tempo; o mais recente espera.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  WEB_URL: https://loja-da-quinta-staging.vercel.app
  API_URL: https://loja-da-quinta-api-staging.onrender.com
  # Contas só de teste, num domínio reservado (.test) que nunca recebe e-mail.
  E2E_GESTOR_EMAIL: e2e-gestor@loja.test
  E2E_FUNCIONARIO_EMAIL: e2e-funcionario@loja.test

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Migrações (papel migrator)
        working-directory: api
        env:
          MIGRATIONS_DATABASE_URL: ${{ secrets.STAGING_MIGRATIONS_DATABASE_URL }}
        run: go run ./cmd/migrate

      - name: Contas dos testes E2E
        working-directory: api
        env:
          DATABASE_URL: ${{ secrets.STAGING_MIGRATIONS_DATABASE_URL }}
          GESTOR_PASSWORD: ${{ secrets.E2E_GESTOR_PASSWORD }}
          FUNCIONARIO_PASSWORD: ${{ secrets.E2E_FUNCIONARIO_PASSWORD }}
        run: |
          if [ -z "$GESTOR_PASSWORD" ] || [ -z "$FUNCIONARIO_PASSWORD" ]; then
            echo "::error::Faltam os segredos E2E_GESTOR_PASSWORD e E2E_FUNCIONARIO_PASSWORD"; exit 1
          fi
          go build -o /tmp/createuser ./cmd/createuser
          NEW_USER_PASSWORD="$GESTOR_PASSWORD" /tmp/createuser -if-missing \
            -email "$E2E_GESTOR_EMAIL" -name "Gestora E2E" -role gestor
          NEW_USER_PASSWORD="$FUNCIONARIO_PASSWORD" /tmp/createuser -if-missing \
            -email "$E2E_FUNCIONARIO_EMAIL" -name "Funcionário E2E" -role funcionario

      - name: Pedir o deploy da API à Render
        env:
          HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        run: |
          test -n "$HOOK" || { echo "::error::Falta o segredo RENDER_STAGING_DEPLOY_HOOK"; exit 1; }
          curl --fail --silent --show-error -X POST "$HOOK" > /dev/null
          echo "Deploy pedido."

      - name: Esperar pela versão nova da API
        run: |
          for i in $(seq 1 60); do
            v=$(curl --silent --max-time 60 "$API_URL/api/v1/healthz" | jq -r '.version // empty' || true)
            if [ "$v" = "$GITHUB_SHA" ]; then echo "API na versão $v"; exit 0; fi
            echo "API em '${v:-sem resposta}', à espera de $GITHUB_SHA ($i/60)"
            sleep 15
          done
          echo "::error::A API não chegou à versão $GITHUB_SHA em 15 minutos"; exit 1

      - name: Confirmar a ligação à base de dados
        run: curl --fail --silent --show-error --max-time 60 "$API_URL/api/v1/readyz"

      - name: Esperar pela versão nova do frontend (Vercel)
        run: |
          for i in $(seq 1 40); do
            v=$(curl --silent --max-time 30 "$WEB_URL/" | grep -o 'name="app-version" content="[^"]*"' | sed 's/.*content="//; s/"$//' || true)
            if [ "$v" = "$GITHUB_SHA" ]; then echo "Frontend na versão $v"; exit 0; fi
            echo "Frontend em '${v:-sem resposta}', à espera de $GITHUB_SHA ($i/40)"
            sleep 15
          done
          echo "::error::O frontend não chegou à versão $GITHUB_SHA em 10 minutos"; exit 1

  e2e:
    name: e2e
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes E2E contra staging
        env:
          E2E_BASE_URL: ${{ env.WEB_URL }}
          E2E_EXPECTED_VERSION: ${{ github.sha }}
          E2E_GESTOR_PASSWORD: ${{ secrets.E2E_GESTOR_PASSWORD }}
          E2E_FUNCIONARIO_PASSWORD: ${{ secrets.E2E_FUNCIONARIO_PASSWORD }}
        run: npm run e2e
      # Só as capturas de ecrã: o repositório é público e os artefactos podem
      # ser descarregados por qualquer pessoa. Traces e relatórios HTML teriam
      # as palavras-passe das contas de teste e tokens (ver playwright.config.ts).
      - name: Guardar as capturas de ecrã se falhar
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: web/test-results/**/*.png
          retention-days: 7
          if-no-files-found: ignore
