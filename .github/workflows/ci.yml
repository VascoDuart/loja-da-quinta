name: ci

# Corre em cada PR para a dev ou a main e em cada push nesses branches.
# O check obrigatório na proteção dos branches é o "ci-ok", que agrega todos
# os outros: assim, jobs saltados por não haver alterações não bloqueiam PRs.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  # Decide que partes do repositório mudaram, para não correr tudo sempre.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            api:
              - 'api/**'
              - 'openapi/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'openapi/**'
              - '.github/workflows/ci.yml'

  # ADR-0012: a main só recebe PRs da dev ou de hotfix/*.
  pr-origin:
    name: pr-origin
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verificar o branch de origem
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" == "dev" || "$HEAD_REF" == hotfix/* ]]; then
            echo "Origem permitida: $HEAD_REF"
          else
            echo "::error::A main só aceita PRs da dev ou de hotfix/*. Este PR vem de '$HEAD_REF'."
            exit 1
          fi

  api-lint:
    name: api-lint
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: api

  # O código gerado e o go.mod têm de estar atualizados no commit.
  api-generated:
    name: api-generated
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Gerar código a partir da OpenAPI
        run: go tool oapi-codegen -config oapi-codegen.yaml ../openapi/openapi.yaml
      - name: go mod tidy
        run: go mod tidy
      - name: Confirmar que não há diferenças
        run: |
          if ! git diff --exit-code -- .; then
            echo "::error::O código gerado ou o go.mod estão desatualizados. Corre 'make api-gen' e 'go mod tidy' e faz commit."
            exit 1
          fi

  api-test:
    name: api-test
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Testes unitários (com deteção de data races)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Testes de integração (PostgreSQL real com testcontainers)
        run: go test -tags=integration -race -count=1 ./test/...
      - name: Resumo da cobertura
        run: |
          {
            echo "### Cobertura da API"
            echo '```'
            go tool cover -func=coverage.out | grep -v '/gen/'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Confirma que a imagem constrói e que o docker compose arranca e responde.
  api-build:
    name: api-build
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Arrancar o docker compose
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/api/v1/healthz
          curl --fail --silent --show-error http://localhost:8080/api/v1/readyz
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
      - name: Parar
        if: always()
        run: docker compose down -v

  # Frontend: lint, tipos, testes, build e dependências vulneráveis.
  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar (exatamente o que está no package-lock.json)
        run: npm ci --ignore-scripts
      - name: Código gerado da OpenAPI atualizado (orval)
        run: |
          npm run gen
          if ! git diff --exit-code -- src/api/generated; then
            echo "::error::O cliente gerado está desatualizado. Corre 'npm run gen' em web/ e faz commit."
            exit 1
          fi
      - name: Formatação (Prettier)
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependências com vulnerabilidades altas ou críticas
        run: npm audit --audit-level=high

  # Único check obrigatório do CI: falha se algum job falhou ou foi cancelado.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, pr-origin, api-lint, api-generated, api-test, api-build, web]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verificar os resultados
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for r in $RESULTS; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::Há jobs do CI que falharam."
              exit 1
            fi
          done
