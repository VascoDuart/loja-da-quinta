version: "2"

run:
  build-tags:
    - integration

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gosec
    - noctx
    - revive
    - sqlclosecheck
  settings:
    revive:
      rules:
        - name: exported
          disabled: true # os comentários estão em português e nem tudo exportado precisa de doc
    depguard:
      rules:
        # ADR-0001: o domínio não conhece HTTP nem SQL. Aplica-se aos
        # ficheiros domain.go de cada módulo (#8 em diante).
        domain:
          files:
            - "**/internal/*/domain.go"
          deny:
            - pkg: net/http
              desc: o domínio não depende de HTTP
            - pkg: database/sql
              desc: o domínio não depende de SQL
            - pkg: github.com/jackc/pgx/v5
              desc: o domínio não depende do driver da base de dados
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/VascoDuart/loja-da-quinta
